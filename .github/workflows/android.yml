name: Build Bakr Scanner APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation des dépendances système
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma

    - name: Installation de Buildozer et Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Pré-génération du SDK et acceptation des licences
      run: |
        buildozer android debug || true
        if [ -d "$HOME/.buildozer/android/platform/android-sdk" ]; then
          yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Compilation finale de l'APK
      run: |
        buildozer android debug

    - name: Telechargement de l'APK genere
      uses: actions/upload-artifact@v4
      with:
        name: Bakr-Scanner-APK
        path: bin/*.apk
